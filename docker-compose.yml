services:
  postgres:
    image: postgres:15
    container_name: mmo-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: mmo
      POSTGRES_USER: mmo
      POSTGRES_PASSWORD: devpassword
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data: